name: Atlas close-match PR checks

on:
  pull_request:
    branches: [main]
    paths:
      - atlas-person-search.js
      - atlas-v3.9.63.html
      - atlas-2d-pedigree-snapshot.js
      - atlas-2d-map.js
      - atlas-2d-journey-preview.html
      - mobile-hybrid-navigation-20261117.js
      - iphone-ancestry-explorer-preview.js
      - tests/atlas-person-close-match.test.mjs
      - tests/atlas-2d-journey.test.mjs
      - .github/workflows/atlas-person-search-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-qa:
    name: Verify search, pedigree and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Node version
        run: node --version
      - name: Atlas search and navigation regressions
        run: |
          node --test tests/atlas-person-close-match.test.mjs tests/atlas-2d-journey.test.mjs tests/mobile-hybrid-navigation.test.mjs tests/iphone-explorer-preview.test.mjs
      - name: Whole-package integrity checks
        run: node verify-package.mjs
