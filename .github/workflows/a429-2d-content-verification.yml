name: A429 temporary 2D ancestry content verification
on:
  pull_request:
    paths:
      - atlas-2d-pedigree-snapshot.js
      - tests/atlas-2d-journey.test.mjs
      - .github/workflows/a429-2d-content-verification.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 2D snapshot lineage, sibling family and exact source mirrors
        run: node --test tests/atlas-2d-journey.test.mjs
      - name: Validate shared original-source governance
        run: |
          node research-source-gate.mjs
          node tests/research-source-gate.mjs
