name: Atlas cross-view integrity

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-atlas-identity-and-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact proposed Atlas code
        uses: actions/checkout@v4
      - name: Node 22 for deterministic no-network tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fail closed on one canonical person graph, stable IDs and original photos
        run: |
          node atlas-graph-integrity-gate.mjs
          node atlas-integrity-gate.mjs
          node atlas-legacy-overlay-gate.mjs
      - name: Test expected failures, person-ID binding and major navigation regressions
        run: |
          node --test tests/atlas-integrity-gate.test.mjs tests/atlas-cross-view-person-continuity.test.mjs
          node --test tests/atlas-artifact-and-overlay-integrity.test.mjs
          node --test tests/a455-weldon-probate-originals.test.mjs
          node --test tests/atlas-canonical-view-guard.test.mjs
          node --test tests/atlas-2d-journey.test.mjs tests/atlas-2d-portrait-crops.test.mjs tests/atlas-name-search.test.mjs tests/atlas-geographic-globe.test.mjs
          node --test tests/atlas-unified-home-family-globe.test.mjs tests/atlas-navigation-rationalization.test.mjs tests/atlas-museum-navigation.test.mjs
          node tests/governance-regression.mjs
