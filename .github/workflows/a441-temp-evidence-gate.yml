name: A441 temporary original-document and legacy gallery regression
on:
  pull_request:
    paths:
      - 'atlas-v3.9.63.html'
      - 'atlas-a441-gooley-original-evidence-reconcile.js'
      - 'tests/a43*.mjs'
      - 'tests/a44*.mjs'
      - '.github/workflows/a441-temp-evidence-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing A437–A440 plus A441 original-source regressions
        run: |
          node --test tests/a437-1893-marriage-original-crosslink.test.mjs tests/a438-1901-canada-original-crosslink.test.mjs tests/a439-charles-death-original-source.test.mjs tests/a440-dennis-1898-peter-1910-originals.test.mjs tests/a441-gooley-original-module-reconciliation.test.mjs
      - name: Legacy 2D family, unified home, and person navigation checks
        run: node --test tests/atlas-2d-journey.test.mjs tests/atlas-unified-home-family-globe.test.mjs tests/atlas-museum-navigation.test.mjs tests/atlas-navigation-rationalization.test.mjs
      - name: Shared original source registry
        run: |
          node research-source-gate.mjs
          node tests/research-source-gate.mjs
          node tests/research-task-intake.mjs
