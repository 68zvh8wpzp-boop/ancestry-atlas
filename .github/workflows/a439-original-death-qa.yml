name: A439 temporary original 1942 death certificate verification
on:
  pull_request:
    paths:
      - 'atlas-v3.9.63.html'
      - 'tests/a439-charles-death-original-source.test.mjs'
      - '.github/workflows/a439-original-death-qa.yml'
jobs:
  historical-original:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 1942 original byte identity and person proof boundary
        run: |
          node --test tests/a439-charles-death-original-source.test.mjs
          node --test tests/a438-1901-canada-original-crosslink.test.mjs
          node --test tests/a437-1893-marriage-original-crosslink.test.mjs
          node --test tests/atlas-2d-journey.test.mjs
