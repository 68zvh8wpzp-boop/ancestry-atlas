name: A430 temporary Jessie original crosslink verification
on:
  pull_request:
    paths:
      - jessie-aurin-mobile-biography.js
      - tests/jessie-aurin-source-viewer.mjs
      - .github/workflows/a430-jessie-original-qa.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Jessie original 1899 image path and transcription
        run: node tests/jessie-aurin-source-viewer.mjs
      - name: Verify Richard original asset contract remains intact
        run: node tests/richard-skinner-source-viewer.mjs
