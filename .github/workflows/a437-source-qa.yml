name: A437 temporary 1893 Alpena original-image integrity check
on:
  pull_request:
    paths:
      - 'atlas-v3.9.63.html'
      - 'tests/a437-1893-marriage-original-crosslink.test.mjs'
      - '.github/workflows/a437-source-qa.yml'
jobs:
  verify-existing-original:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 1893 original binary and four person galleries
        run: node --test tests/a437-1893-marriage-original-crosslink.test.mjs
      - name: Check 2D map and person page core regressions
        run: |
          node --test tests/atlas-2d-journey.test.mjs
          node --test tests/atlas-cross-view-person-continuity.test.mjs
