name: Atlas source and person-page review (no deployment)
on:
  pull_request:
    branches:
      - main
      - review/a046-sarah-photo-and-museum-20261110
      - review/a047-proof-queue-and-release-qa-20261110
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-page-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free image integrity dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Run all staged Atlas person-page regression tests
        run: node --test tests/atlas_*.test.mjs
      - name: Audit six original Fable recordings without changing bytes
        if: always()
        run: |
          # GitHub's runner image no longer guarantees ffprobe/ffmpeg.
          # Official Ubuntu apt packages, no API use and no paid services.
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          node scripts/a048-fable-audio-forensics.mjs
      - name: Recover Aug 30 previously approved narration in temporary review-output only
        if: always()
        run: |
          git fetch --no-tags --depth=1 origin fa41af02e7a6405a0150a3ba9be3a84391463627
          node scripts/a048-recover-previous-approved-fable.mjs
      - name: Archive verified historical audio as a private review candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A048-original-approved-Fable-recovery
          path: review-output/a048-approved-fable-20260830/
          if-no-files-found: warn
          retention-days: 14
      - name: Validate whole packaged Atlas and image decoders
        run: node verify-package.mjs
      - name: Diagnostic only — show immutable SHA256 values when validation fails
        if: failure()
        run: |
          sha256sum approved-audio/fable/Charles_albert_brenay.mp3
          sha256sum approved-audio/fable/Charles_godfrey_brenay.mp3
          sha256sum approved-audio/fable/Ida_mae_gooley.mp3
          sha256sum approved-audio/fable/John_peter_gooley.mp3
          sha256sum approved-audio/fable/Mary_ann_dennis.mp3
          sha256sum approved-audio/fable/James_wilford_webb.mp3
          grep '^packageVersion' PACKAGE_ASSET_MANIFEST.json || true
      - name: Check original-source research governance
        if: always()
        run: |
          node research-source-gate.mjs
          node tests/research-source-gate.mjs
          node tests/research-task-intake.mjs
