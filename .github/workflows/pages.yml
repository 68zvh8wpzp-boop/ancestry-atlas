name: Deploy Atlas to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shared original-source registry and task ownership
        run: |
          node research-source-gate.mjs
          node tests/research-source-gate.mjs
          node tests/research-task-intake.mjs

      - name: Verify Richard Skinner source viewer and iPhone link contract
        run: node tests/richard-skinner-source-viewer.mjs

      - name: Verify Jessie Aurin original census and parent-evidence contract
        run: node tests/jessie-aurin-source-viewer.mjs

      - name: Set up Node for all Atlas regression tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python for packaged image validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install free image-validation dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Run all person-page regression tests before publication
        run: node --test tests/atlas_*.test.mjs

      - name: Run complete packaged-asset and image integrity verifier
        run: node verify-package.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
