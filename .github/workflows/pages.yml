name: Deploy Atlas to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shared original-source registry and task ownership
        run: |
          node research-source-gate.mjs
          node tests/research-source-gate.mjs
          node tests/research-task-intake.mjs

      - name: Verify Richard Skinner source viewer and iPhone link contract
        run: node tests/richard-skinner-source-viewer.mjs

      - name: Verify Jessie Aurin original census and parent-evidence contract
        run: node tests/jessie-aurin-source-viewer.mjs

      - name: Verify A075 original memoir biography corrections and cache refresh
        run: node --test tests/atlas-a075-biography-source-release.test.mjs

      - name: Verify A083 Gooley source-quality core record
        run: node --test tests/atlas-a083-gooley-core-birthplace-caveat.test.mjs

      - name: Verify A084 Mary Weedon proof boundary
        run: node --test tests/atlas-a084-molly-weedon-proof-boundary.test.mjs

      - name: Verify A085 Elizabeth Webb source identity
        run: node --test tests/atlas-a085-elizabeth-webb-evidence-gates.test.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
