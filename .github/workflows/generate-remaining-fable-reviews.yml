name: Generate Remaining Fable Reviews

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-reviews:
    name: Create six review-only MP3s
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the current production source
        uses: actions/checkout@v4

      - name: Confirm the protected API key is available
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Repository secret OPENAI_API_KEY is missing."
            exit 1
          fi

      - name: Generate six Fable reviews
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-remaining-fable-reviews.mjs

      - name: Upload private review package
        uses: actions/upload-artifact@v4
        with:
          name: remaining-fable-reviews-${{ github.run_number }}
          path: review-output/
          if-no-files-found: error
          retention-days: 14
