name: Generate Webb Fable Reviews

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/webb-fable-review-trigger

permissions:
  contents: read

jobs:
  generate-reviews:
    name: Create five review-only Webb MP3s
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the approved Webb source
        uses: actions/checkout@v4

      - name: Confirm the protected API key is available
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Repository secret OPENAI_API_KEY is missing."
            exit 1
          fi

      - name: Validate the five locked narration inputs
        run: node scripts/generate-webb-fable-reviews.mjs --validate-only

      - name: Generate five Fable review recordings
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-webb-fable-reviews.mjs

      - name: Upload private Webb review package
        uses: actions/upload-artifact@v4
        with:
          name: webb-fable-reviews-${{ github.run_number }}
          path: review-output/webb-fable/
          if-no-files-found: error
          retention-days: 14
