name: A440 temporary Gooley-Dennis original evidence regression
on:
  pull_request:
    paths:
      - 'atlas-v3.9.63.html'
      - 'tests/a439-charles-death-original-source.test.mjs'
      - 'tests/a438-1901-canada-original-crosslink.test.mjs'
      - 'tests/a440-dennis-1898-peter-1910-originals.test.mjs'
      - '.github/workflows/a440-original-proof-qa.yml'
jobs:
  original-source-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test 1898 Dennis, 1910 Peter and 1901 original master source evidence
        run: |
          node --test tests/a440-dennis-1898-peter-1910-originals.test.mjs
          node --test tests/a438-1901-canada-original-crosslink.test.mjs
          node --test tests/a439-charles-death-original-source.test.mjs
          node --test tests/a437-1893-marriage-original-crosslink.test.mjs
          node --test tests/atlas-2d-journey.test.mjs
          node --test tests/atlas-cross-view-person-continuity.test.mjs
