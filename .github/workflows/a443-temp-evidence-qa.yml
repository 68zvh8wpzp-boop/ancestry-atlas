name: A443 temporary Brenay original gallery source regression
on:
  pull_request:
    paths:
      - 'atlas-v3.9.63.html'
      - 'atlas-a443-brenay-original-evidence-reconcile.js'
      - 'tests/a443-brenay-legacy-evidence-reconciliation.test.mjs'
      - '.github/workflows/a443-temp-evidence-qa.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: A443 Brenay runtime evidence reconciliation
        run: node --test tests/a443-brenay-legacy-evidence-reconciliation.test.mjs
      - name: Preserve A437-A441 originals, navigation and relationships
        run: |
          node --test tests/a437-1893-marriage-original-crosslink.test.mjs tests/a438-1901-canada-original-crosslink.test.mjs tests/a439-charles-death-original-source.test.mjs tests/a440-dennis-1898-peter-1910-originals.test.mjs tests/a441-gooley-original-module-reconciliation.test.mjs
          node --test tests/atlas-2d-journey.test.mjs tests/atlas-unified-home-family-globe.test.mjs tests/atlas-navigation-rationalization.test.mjs
