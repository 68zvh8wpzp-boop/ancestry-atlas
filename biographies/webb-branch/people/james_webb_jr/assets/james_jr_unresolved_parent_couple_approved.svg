<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The unresolved parent couple of James Webb Jr.</title>
  <desc id="desc">James Webb Sr. is a reported father awaiting decisive original evidence. Elizabeth Douglas has an identity conflict. Neither is promoted into the supported pedigree.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102333"/><stop offset="1" stop-color="#07111b"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="130" y="145" fill="#93a6b7" font-family="Arial, sans-serif" font-size="28" letter-spacing="5">REPORTED PARENTS OF</text>
  <text x="130" y="220" fill="#f0eadf" font-family="Georgia, serif" font-size="56">James Webb Jr. · born 1777</text>
  <line x1="130" y1="345" x2="750" y2="345" stroke="#738394" stroke-width="3"/>
  <line x1="850" y1="345" x2="1470" y2="345" stroke="#738394" stroke-width="3"/>
  <text x="130" y="420" fill="#f0eadf" font-family="Georgia, serif" font-size="54">James Webb Sr.</text>
  <text x="850" y="420" fill="#f0eadf" font-family="Georgia, serif" font-size="54">Elizabeth Douglas</text>
  <text x="130" y="485" fill="#a9b7c4" font-family="Arial, sans-serif" font-size="27">Named in the compiled family tradition;</text>
  <text x="130" y="525" fill="#a9b7c4" font-family="Arial, sans-serif" font-size="27">decisive original evidence not yet found.</text>
  <text x="850" y="485" fill="#a9b7c4" font-family="Arial, sans-serif" font-size="27">Conflicting records and trees appear to combine</text>
  <text x="850" y="525" fill="#a9b7c4" font-family="Arial, sans-serif" font-size="27">two different women of the same name.</text>
  <text x="130" y="610" fill="#d59a55" font-family="Arial, sans-serif" font-size="25" letter-spacing="4">UNRESOLVED PARENTAGE</text>
  <text x="850" y="610" fill="#d59a55" font-family="Arial, sans-serif" font-size="25" letter-spacing="4">IDENTITY CONFLICT</text>
  <line x1="130" y1="725" x2="630" y2="725" stroke="#536271" stroke-width="2"/>
  <line x1="970" y1="725" x2="1470" y2="725" stroke="#536271" stroke-width="2"/>
  <text x="800" y="736" fill="#93a6b7" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" letter-spacing="3">NOT PROMOTED INTO THE SUPPORTED PEDIGREE</text>
</svg>
